name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Rust components
        run: rustup component add rustfmt clippy

      - name: Rust formatting
        run: cargo fmt --check

      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Release build
        run: cargo build --release

      - name: Python syntax
        run: python3 -m py_compile scripts/scene_to_glb.py
